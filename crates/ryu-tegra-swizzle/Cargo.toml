[package]
name = "ryu-tegra-swizzle"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors = ["Ryubing Contributors"]
description = "Tegra block-linear to linear texture layout conversion for Ryubing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lints]
workspace = true
