[package]
name = "ryu-video-vic"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
authors = ["Ryubing Contributors"]
description = "VIC surface blending, colour-space conversion and deinterlacing for Ryubing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lints]
workspace = true
