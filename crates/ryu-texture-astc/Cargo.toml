[package]
name = "ryu-texture-astc"
version = "0.1.1"
edition = "2021"
license.workspace = true
repository.workspace = true
authors = ["Ryubing Contributors"]
description = "ASTC block decompression to RGBA8 for Ryubing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = { version = "1.12.0", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lints]
workspace = true
