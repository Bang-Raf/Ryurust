[workspace]
resolver = "2"
members = [
    "crates/ryu-audio-dsp",
    "crates/ryu-audio-fx",
    "crates/ryu-audio-mixer",
    "crates/ryu-audio-resampler",
    "crates/ryu-buffer-diff",
    "crates/ryu-common-hash",
    "crates/ryu-gal-queue",
    "crates/ryu-gpu-gpfifo",
    "crates/ryu-host1x-syncpoint",
    "crates/ryu-interval-tree",
    "crates/ryu-ipc-parser",
    "crates/ryu-jit-regalloc",
    "crates/ryu-kernel-scheduler",
    "crates/ryu-kernel-sync",
    "crates/ryu-maxwell-state",
    "crates/ryu-memory-pagetable",
    "crates/ryu-memory-tracking",
    "crates/ryu-motion-fusion",
    "crates/ryu-pixel-converter",
    "crates/ryu-romfs-indexer",
    "crates/ryu-shader-cache",
    "crates/ryu-shader-transpiler",
    "crates/ryu-storage-fs",
    "crates/ryu-surfaceflinger-queue",
    "crates/ryu-tegra-mme",
    "crates/ryu-tegra-swizzle",
    "crates/ryu-texture-astc",
    "crates/ryu-texture-bcn",
    "crates/ryu-texture-matcher",
    "crates/ryu-video-nvdec",
    "crates/ryu-video-vic",
    "crates/ryu-vulkan-descriptors",
    "benches",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Bang-Raf/Ryurust"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

# Lints that existing crates trip today. They are allowed here so CI can run
# clippy with `-D warnings` for everything else. Each one is cleanup work:
# fix the code, then delete the line. See docs/DEVELOPMENT.md.
[workspace.lints.clippy]
excessive_precision = "allow"        # filter/coefficient tables
missing_safety_doc = "allow"         # FFI functions lack `# Safety` docs
not_unsafe_ptr_arg_deref = "allow"   # safe `extern "C"` fns deref raw pointers
needless_range_loop = "allow"
manual_div_ceil = "allow"
identity_op = "allow"
too_many_arguments = "allow"
manual_is_multiple_of = "allow"
manual_memcpy = "allow"
unnecessary_cast = "allow"
manual_clamp = "allow"
field_reassign_with_default = "allow"
question_mark = "allow"
manual_range_contains = "allow"
new_without_default = "allow"
double_parens = "allow"
needless_return = "allow"
if_same_then_else = "allow"
manual_range_patterns = "allow"
manual_checked_ops = "allow"
len_zero = "allow"
derivable_impls = "allow"
empty_line_after_doc_comments = "allow"
chunks_exact_to_as_chunks = "allow"
unwrap_or_default = "allow"
approx_constant = "allow"
